services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lingo:${POSTGRES_PASSWORD}@db:5432/lingo
      BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lingo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lingo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingo -d lingo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lingo_pgdata:/var/lib/postgresql/data

volumes:
  lingo_pgdata:
